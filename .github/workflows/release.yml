name: Release

# Disparo manual: Actions > Release > Run workflow (na branch main).
# A versão é calculada no formato yyyy.MM.dd.NN (NN reinicia a cada dia) e vira a tag vyyyy.MM.dd.NN.
#
# Estrutura (privilégio mínimo):
#   gate    -> confirma que o commit tem o CI verde (checks: read).
#   build   -> compila, testa, publica, assina (se configurado) e gera o instalador (contents: read).
#   publish -> única etapa com contents: write; só baixa os artefatos prontos e cria a release.
#
# Actions de terceiros ficam fixadas por SHA de commit (a tag está no comentário). O Dependabot atualiza os SHAs.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Exigir CI verde no commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O job do CI (.github/workflows/ci.yml) chama-se build-and-test. 'filter=latest' devolve a execução mais recente.
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=build-and-test&filter=latest" --jq '.check_runs[0].conclusion // "ausente"')
          echo "Conclusão do CI em $GITHUB_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::O CI (build-and-test) não está verde para o commit $GITHUB_SHA (estado: $conclusion). Aguarde o CI terminar com sucesso e execute o Release novamente."
            exit 1
          fi

  build:
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Assinatura de código (Azure Trusted Signing). Só roda quando a variável abaixo existe.
      SIGNING_ENABLED: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}

    steps:
      - name: Baixar o código e as tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Avisar se a assinatura não estiver configurada
        if: env.SIGNING_ENABLED != 'true'
        shell: pwsh
        run: Write-Host '::warning::Assinatura de código NÃO configurada (variável AZURE_SIGNING_ACCOUNT ausente). Os binários desta release NÃO serão assinados e o SmartScreen avisará sobre editor desconhecido.'

      - name: Calcular versão
        id: version
        shell: pwsh
        run: |
          # fetch-depth: 0 já traz todas as tags; não é preciso credencial para buscá-las de novo.
          $version = & ./tools/Get-NextVersion.ps1
          if ($version -notmatch '^\d{4}\.\d{2}\.\d{2}\.\d{2,}$') { throw "Versão inválida: $version" }
          if (git tag --list "v$version") { throw "A tag v$version já existe." }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $version"

      - name: Configurar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        shell: pwsh
        run: dotnet restore Atualizador.Windows.slnx

      - name: Compilar
        shell: pwsh
        run: dotnet build Atualizador.Windows.slnx --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Executar testes
        shell: pwsh
        run: dotnet test tests/Atualizador.Windows.Tests/Atualizador.Windows.Tests.csproj --configuration Release --no-build

      - name: Publicar executável portátil
        shell: pwsh
        run: |
          dotnet restore src/Atualizador.Windows/Atualizador.Windows.csproj --runtime win-x64
          dotnet publish src/Atualizador.Windows/Atualizador.Windows.csproj --configuration Release --no-restore --output artifacts/publish/win-x64 -p:PublishProfile=WinX64 -p:Version=${{ steps.version.outputs.version }}
          New-Item -ItemType Directory -Force artifacts/release | Out-Null

      - name: Assinar executável
        if: env.SIGNING_ENABLED == 'true'
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\publish\win-x64\Atualizador.Windows.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Copiar executável
        shell: pwsh
        run: Copy-Item artifacts/publish/win-x64/Atualizador.Windows.exe artifacts/release/Atualizador.exe -Force

      - name: Instalar Inno Setup no runner
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          # Desde março de 2026 os instaladores ficam nas releases do GitHub (files.jrsoftware.org devolve 404).
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $expectedHash = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $actualHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "SHA-256 do Inno Setup inesperado: $actualHash" }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') { throw "Assinatura do Inno Setup inválida: $($signature.Status)" }
          $subject = $signature.SignerCertificate.Subject
          if ($subject -notmatch 'Jordan Russell|JR Software|Pyrsys') { throw "Signatário inesperado no instalador do Inno Setup: $subject" }
          Write-Host "Inno Setup assinado por: $subject"
          $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -NoNewWindow -PassThru
          if ($process.ExitCode -ne 0) { throw "A instalação do Inno Setup falhou com código $($process.ExitCode)." }

      - name: Compilar instalador
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe do Inno Setup 7 não foi localizado.' }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer/Atualizador.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe falhou com código $LASTEXITCODE" }
          Copy-Item artifacts/Atualizador-Setup.exe artifacts/release/Atualizador-Setup.exe -Force

      - name: Assinar instalador
        if: env.SIGNING_ENABLED == 'true'
        uses: Azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\release\Atualizador-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Gerar somas SHA-256
        shell: pwsh
        run: |
          Push-Location artifacts/release
          Get-ChildItem Atualizador.exe, Atualizador-Setup.exe |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location

      - name: Guardar artefatos da release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Baixar artefatos da release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release

      - name: Conferir integridade dos artefatos
        shell: bash
        run: |
          cd release
          ls -l
          sha256sum -c SHA256SUMS.txt

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"
          gh release create "$tag" \
            release/Atualizador.exe \
            release/Atualizador-Setup.exe \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Atualizador Windows $VERSION" \
            --generate-notes \
            --latest
          gh release view "$tag" --json tagName,isPrerelease,assets
